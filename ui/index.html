<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiko OS Assistant</title>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <style>
        /* Importing Premium Typography */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');
        
        :root {
            font-family: 'Inter', sans-serif;
        }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        
        /* Custom sleek scrollbars */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 4px; }
        .dark ::-webkit-scrollbar-thumb { background: #3f3f46; }
        ::-webkit-scrollbar-thumb:hover { background: #9ca3af; }
        
        .chat-container { scroll-behavior: smooth; }
        
        /* Smooth theme transitions */
        body { transition: background-color 0.3s ease, color 0.3s ease; }
    </style>
    <script>
      // Apply theme before render to prevent flash
      if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
    </script>
</head>
<body class="bg-zinc-50 dark:bg-zinc-950 text-zinc-900 dark:text-zinc-100 h-screen flex overflow-hidden selection:bg-teal-500/30">

    <!-- Premium Sidebar -->
    <aside class="w-[280px] bg-zinc-100/50 dark:bg-zinc-900/50 border-r border-zinc-200 dark:border-zinc-800 flex flex-col h-full shrink-0 transition-colors">
        
        <!-- App Identity & Theme Toggle -->
        <div class="h-16 flex items-center justify-between px-5 border-b border-zinc-200 dark:border-zinc-800">
            <div class="flex items-center gap-3">
                <div class="w-2 h-2 rounded-full bg-teal-500 animate-pulse shadow-[0_0_8px_rgba(20,184,166,0.8)]"></div>
                <span class="font-semibold tracking-wide text-sm uppercase text-zinc-800 dark:text-zinc-200">Kiko System</span>
            </div>
            
            <button id="theme-toggle" class="p-2 rounded-lg text-zinc-500 hover:text-zinc-800 dark:hover:text-zinc-200 hover:bg-zinc-200/80 dark:hover:bg-zinc-800 transition-colors">
                <!-- Moon icon (default) -->
                <svg id="theme-icon-dark" class="w-4 h-4 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                <!-- Sun icon (dark mode) -->
                <svg id="theme-icon-light" class="w-4 h-4 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
            </button>
        </div>

        <div class="p-4">
            <button id="new-chat-btn" class="w-full bg-zinc-900 dark:bg-zinc-100 text-zinc-100 dark:text-zinc-900 py-2.5 px-4 rounded-lg font-medium text-sm hover:scale-[1.02] active:scale-95 transition-all flex items-center justify-center gap-2 shadow-sm">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                Initialize Arc
            </button>
        </div>
        
        <div class="px-5 py-2 text-[10px] font-semibold text-zinc-400 dark:text-zinc-500 uppercase tracking-widest">Episodic Memory</div>
        
        <div id="session-list" class="flex-1 overflow-y-auto px-3 pb-4 space-y-0.5 mt-2">
            <!-- Sessions -->
        </div>
        
        <div class="p-4 border-t border-zinc-200 dark:border-zinc-800 text-[10px] text-zinc-400 dark:text-zinc-600 font-mono text-center tracking-wide">
            CORE: FASTAPI // OS: NATIVE
        </div>
    </aside>

    <!-- Main Chat Area -->
    <main class="flex-1 flex flex-col h-full relative min-w-0 bg-white dark:bg-zinc-950 transition-colors">
        
        <!-- Header -->
        <header class="h-16 flex items-center justify-center px-6 sticky top-0 z-10 shrink-0">
            <h1 id="current-session-title" class="font-medium text-sm text-zinc-500 dark:text-zinc-400">Awaiting Connection</h1>
        </header>

        <!-- Chat Feed -->
        <div id="chat-feed" class="flex-1 overflow-y-auto px-4 md:px-12 py-6 space-y-8 chat-container flex flex-col">
            <!-- Empty State -->
            <div class="m-auto flex flex-col items-center justify-center text-zinc-400 dark:text-zinc-600">
                <div class="text-3xl mb-3 font-light">( ˘ ▽ ˘ )</div>
                <p class="text-sm font-medium tracking-wide">Awaiting command, Senpai...</p>
            </div>
        </div>

        <!-- Input Area -->
        <div class="p-4 pb-8 shrink-0">
            <div class="max-w-4xl mx-auto relative flex items-end bg-zinc-50 dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 rounded-2xl focus-within:border-teal-500/50 dark:focus-within:border-teal-500/50 focus-within:ring-4 focus-within:ring-teal-500/10 transition-all shadow-sm">
                <textarea id="chat-input" rows="1" class="w-full bg-transparent border-0 focus:outline-none focus:ring-0 resize-none py-4 pl-5 pr-14 max-h-40 min-h-[56px] text-[15px] text-zinc-800 dark:text-zinc-200 placeholder-zinc-400 dark:placeholder-zinc-600" placeholder="Instruct Kiko..."></textarea>
                
                <button id="send-btn" class="absolute right-3 bottom-3 p-2 rounded-xl bg-zinc-900 dark:bg-zinc-100 text-zinc-100 dark:text-zinc-900 hover:scale-105 active:scale-95 transition-all disabled:opacity-30 disabled:scale-100 shadow-sm">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 12h14M12 5l7 7-7 7"></path></svg>
                </button>
            </div>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
