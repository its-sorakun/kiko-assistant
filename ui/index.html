<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiko OS Assistant</title>
    <!-- Utilizing Tailwind v4 via CDN for zero-build lightweight frontend -->
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <style>
        /* Custom scrollbar to keep it sleek */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #e5e7eb; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #d1d5db; }
        .chat-container { scroll-behavior: smooth; }
    </style>
</head>
<body class="bg-[#fafafa] text-[#111] h-screen flex overflow-hidden font-sans antialiased">

    <!-- Sidebar -->
    <aside class="w-64 bg-white border-r border-gray-200 flex flex-col h-full shadow-sm z-10 shrink-0">
        <div class="p-4 border-b border-gray-200">
            <button id="new-chat-btn" class="w-full bg-[#111] text-white py-2 px-4 rounded-md font-medium text-sm hover:bg-gray-800 transition-colors flex items-center justify-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                New Arc
            </button>
        </div>
        
        <div class="p-3 text-xs font-semibold text-gray-400 uppercase tracking-wider">Episodic Memory</div>
        
        <div id="session-list" class="flex-1 overflow-y-auto px-2 pb-4 space-y-1">
            <!-- Sessions will be injected here -->
        </div>
        
        <div class="p-4 border-t border-gray-200 text-xs text-gray-400 flex items-center gap-2">
            <div class="w-2 h-2 rounded-full bg-teal-500 shadow-[0_0_8px_rgba(20,184,166,0.6)]"></div>
            Kiko System Online
        </div>
    </aside>

    <!-- Main Chat Area -->
    <main class="flex-1 flex flex-col h-full relative min-w-0">
        <!-- Header -->
        <header class="h-14 border-b border-gray-200 flex items-center px-6 bg-white/80 backdrop-blur-sm sticky top-0 z-10 shrink-0">
            <h1 id="current-session-title" class="font-semibold text-gray-800">Select an Arc</h1>
        </header>

        <!-- Chat Feed -->
        <div id="chat-feed" class="flex-1 overflow-y-auto p-6 space-y-6 chat-container">
            <!-- Empty State -->
            <div class="h-full flex flex-col items-center justify-center text-gray-400">
                <div class="text-4xl mb-4">( ˘ ▽ ˘ )</div>
                <p>Awaiting your command, Senpai...</p>
            </div>
        </div>

        <!-- Input Area -->
        <div class="p-4 bg-white border-t border-gray-200 shrink-0">
            <div class="max-w-3xl mx-auto relative flex items-end bg-gray-50 border border-gray-200 rounded-xl focus-within:ring-2 focus-within:ring-teal-500/20 focus-within:border-teal-500 transition-all shadow-sm">
                <textarea id="chat-input" rows="1" class="w-full bg-transparent border-0 focus:outline-none focus:ring-0 resize-none py-3 pl-4 pr-12 max-h-32 min-h-[44px] text-gray-700 placeholder-gray-400" placeholder="Ask Kiko to check your temps, play Spotify, or read files..."></textarea>
                <button id="send-btn" class="absolute right-2 bottom-2 p-2 rounded-lg text-teal-600 hover:bg-teal-50 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                </button>
            </div>
            <div class="text-center mt-2 text-[10px] text-gray-400">Kiko operates natively. Use OS commands at your own risk.</div>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
